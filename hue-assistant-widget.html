<div id="hue-widget-root">

  <!-- Collapsed launcher -->
  <div id="hue-launcher-group" aria-hidden="false">
    <div id="hue-launcher-bubble">Welcome to Horus University.</div>
    <img id="hue-launcher-mascot" src="assets/hello.png"/>
    <button id="hue-launcher" aria-label="Chat with HUE Assistant" aria-expanded="false">
      Chat with HUE Assistant
    </button>
  </div>
  <!-- Chat window -->
  <div id="hue-chat" aria-hidden="true">

    <!-- Header -->
    <div id="hue-header">
      <div id="hue-header-left">
        <span id="hue-header-avatar">
          <img src="assets/icon.png"/>
               </span>
        <div>
          <div id="hue-header-title">HUE Assistant</div>
          <div id="hue-header-sub">Online · Ready to help</div>
        </div>
      </div>
      <button id="hue-close" aria-label="Close chat">&times;</button>
    </div>

    <!-- Peeking mascot, tucked at the bottom-right edge of the window -->
    <img id="hue-peek-mascot-outer" class="hue-peek-outer" src="assets/chat_left.png"/>
    <!-- Messages -->
    <div id="hue-messages">
      <img id="hue-welcome-mascot" src="assets/hello.png"/>
    </div>
    
    <!-- Quick questions (dynamically rendered by JS: main categories -> sub-categories -> answer) -->
    <div id="hue-quick-questions"></div>

    <!-- Input row temporarily disabled: menu-driven flow only for now.
    <form id="hue-input-row">
      <input id="hue-input" type="text" placeholder="Type your question..." autocomplete="off" />
      <button id="hue-send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 11.5L20 4L12.5 21L10.3 13.2L3 11.5Z" fill="currentColor"/>
        </svg>
      </button>
    </form>
    -->
  </div>
</div>

<style>
  #hue-widget-root, #hue-widget-root * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- Launcher (bubble + mascot + button) ---------- */
  #hue-launcher-group {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 999998;
    width: 300px;
    max-width: calc(100vw - 32px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    animation: hueLauncherIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes hueLauncherIn {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  #hue-launcher-bubble {
    align-self: flex-start;
    background: #FBF7F1;
    color: #12213E;
    font-size: 14px;
    font-weight: 600;
    padding: 14px 18px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(18, 33, 62, 0.18);
    margin-bottom: -10px;
    z-index: 2;
    animation: hueBubbleFloat 3.6s ease-in-out infinite;
  }
  @keyframes hueBubbleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  #hue-launcher-mascot {
    width: 150px;
    height: auto;
    margin-right: -10px;
    filter: drop-shadow(0 10px 18px rgba(18, 33, 62, 0.25));
    pointer-events: none;
  }
  #hue-launcher {
    display: block;
    width: 100%;
    background: #F4B942;
    color: #12213E;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 8px 24px rgba(18, 33, 62, 0.25);
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
    margin-top: -6px;
  }
  #hue-launcher:hover {
    transform: translateY(-2px) scale(1.015);
    box-shadow: 0 10px 28px rgba(18, 33, 62, 0.32);
  }
  #hue-launcher:active { transform: translateY(0) scale(0.99); }
  #hue-widget-root.hue-open #hue-launcher-group { display: none; }

  /* ---------- Chat window ---------- */
  #hue-chat {
    position: fixed;
    right: 50px;
    bottom: 24px;
    z-index: 999999;
    width: 380px;
    max-width: calc(100vw - 32px);
    height: 560px;
    max-height: calc(100vh - 48px);
    background: #FBF7F1;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(18, 33, 62, 0.35);
    display: none;
    flex-direction: column;
    overflow: visible;
    opacity: 0;
    transform-origin: bottom right;
    transform: translateY(24px) scale(0.94);
    transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #hue-chat > *:not(.hue-peek-outer) { position: relative; z-index: 1; }
  #hue-chat > #hue-header,
  #hue-chat > #hue-messages,
  #hue-chat > #hue-quick-questions,
  #hue-chat > #hue-input-row {
    border-radius: 0;
  }
  #hue-header { border-radius: 24px 24px 0 0; overflow: hidden; }
  #hue-messages { overflow-y: auto; scroll-behavior: smooth; }
  #hue-widget-root.hue-open #hue-chat {
    display: flex;
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* Header */
  #hue-header {
    background: #12213E;
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #hue-header-left { display: flex; align-items: center; gap: 10px; }
  #hue-header-avatar {
    background: #1B2E52;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  #hue-header-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    transform: scale(1.6);
  }
  #hue-header-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
  #hue-header-sub { font-size: 11.5px; color: #A9B6D6; line-height: 1.3; }
  #hue-close {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    opacity: 0.8;
    transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    border-radius: 50%;
  }
  #hue-close:hover { opacity: 1; transform: rotate(90deg); }

  /* Messages */
  #hue-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
  }
  #hue-welcome-mascot {
    width: 150px;
    height: auto;
    align-self: center;
    margin: 4px 0 8px;
    filter: drop-shadow(0 6px 14px rgba(18,33,62,0.18));
    animation: hueMascotFloat 3.2s ease-in-out infinite;
  }
  @keyframes hueMascotFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  #hue-welcome-mascot.hue-hidden { display: none; }

  /* Peeking mascot tucked at the bottom-right edge of the chat window,
     positioned relative to #hue-chat so it stays fixed even while messages scroll */
  #hue-chat .hue-peek-outer {
    position: absolute !important;
    right: -17%;
    bottom: 24px;
    width: 88px;
    height: auto;
    pointer-events: none;
    z-index: 2;
    filter: drop-shadow(0 4px 10px rgba(18,33,62,0.3));
  }
  .hue-msg {
    max-width: 82%;
    font-size: 13.5px;
    line-height: 1.45;
    padding: 10px 13px;
    border-radius: 14px;
    white-space: pre-line;
    animation: hueMsgIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes hueMsgIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .hue-msg.bot {
    align-self: flex-start;
    background: #fff;
    color: #1D2A44;
    border: 1px solid #EDE6DA;
    border-bottom-left-radius: 4px;
  }
  .hue-msg.user {
    align-self: flex-end;
    background: #12213E;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  /* Typing indicator */
  .hue-typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: #fff;
    border: 1px solid #EDE6DA;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    animation: hueMsgIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  #hue-chat[dir="rtl"] .hue-typing { align-self: flex-end; border-bottom-left-radius: 14px; border-bottom-right-radius: 4px; }
  .hue-typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #B9AF9A;
    animation: hueTypingBounce 1.1s infinite ease-in-out;
  }
  .hue-typing span:nth-child(2) { animation-delay: 0.15s; }
  .hue-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes hueTypingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* RTL support for Arabic mode */
  #hue-chat[dir="rtl"] { direction: rtl; text-align: right; }
  #hue-chat[dir="rtl"] .hue-msg.bot { align-self: flex-end; border-bottom-left-radius: 14px; border-bottom-right-radius: 4px; }
  #hue-chat[dir="rtl"] .hue-msg.user { align-self: flex-start; border-bottom-left-radius: 4px; border-bottom-right-radius: 14px; }
  #hue-chat[dir="rtl"] .hue-qq-back { text-align: right; }

  /* Quick questions / dynamic menu */
  #hue-quick-questions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 16px 14px;
    flex-shrink: 0;
    max-height: 220px;
    overflow-y: auto;
  }
  #hue-quick-questions.hue-menu-list {
    grid-template-columns: 1fr;
  }
  .hue-qq {
    background: #fff;
    border: 1px solid #E4DACB;
    color: #12213E;
    font-size: 12px;
    font-weight: 600;
    padding: 9px 8px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    animation: hueQqIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: calc(var(--hue-i, 0) * 45ms);
  }
  @keyframes hueQqIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hue-qq:hover { background: #FBEED2; border-color: #F4B942; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(18,33,62,0.12); }
  .hue-qq:active { transform: translateY(0); }
  .hue-qq-back {
    grid-column: 1 / -1;
    background: transparent;
    border: none;
    color: #7A6A4F;
    font-size: 12px;
    font-weight: 600;
    text-align: left;
    padding: 2px 4px 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .hue-qq-back:hover { color: #12213E; }

  /* Input row */
  #hue-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid #EDE6DA;
    background: #fff;
    flex-shrink: 0;
    border-radius: 0 0 24px 24px;
  }
  #hue-input {
    flex: 1;
    border: 1px solid #E4DACB;
    border-radius: 999px;
    padding: 10px 14px;
    font-size: 13.5px;
    outline: none;
    background: #FBF7F1;
    color: #1D2A44;
  }
  #hue-input:focus { border-color: #F4B942; }
  #hue-send {
    background: #12213E;
    color: #F4B942;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #hue-send:hover { background: #1B2E52; }

  @media (max-width: 480px) {
    #hue-chat {
      right: 12px;
      bottom: 12px;
      width: calc(100vw - 24px);
      height: calc(100vh - 24px);
    }
    #hue-launcher-group { right: 12px; bottom: 12px; width: 240px; }
    #hue-launcher-mascot { width: 110px; }
  }
</style>

<script>

  // ---- Menu tree: each node is either a leaf ("answer") or has "children" (sub-menu) ----
  // label/answer are { en, ar }

            label: { en: "How to Apply", ar: "طريقة التقديم" },

      "tuition": {

        children: {
          "t_medicine": { label: { en: "Faculty of Medicine", ar: "كلية الطب البشري" }, answer: { en: "Faculty of Human Medicine: 270,000 EGP / year (2026/2027).\n\n" + mandatoryFeesDisclaimer.en, ar: "كلية الطب البشري: 270,000 جنيه مصري / سنوياً (2026/2027).\n\n" + mandatoryFeesDisclaimer.ar } },
          "t_dentistry": { label: { en: "Faculty of Dentistry", ar: "كلية طب الأسنان" }, answer: { en: "Faculty of Dentistry: 190,000 EGP / year (2026/2027).\n\n" + mandatoryFeesDisclaimer.en, ar: "كلية طب الأسنان: 190,000 جنيه مصري / سنوياً (2026/2027).\n\n" + mandatoryFeesDisclaimer.ar } },

          "faq_escalate_financial": {
            label: { en: "I have a payment/installment issue", ar: "لدي مشكلة في الدفع/الأقساط" },
            answer: { en: "Please contact the Financial Department directly for payment tracking or installment issues.", ar: "يُرجى التواصل مباشرة مع الإدارة المالية لمتابعة المدفوعات أو مشاكل الأقساط." }
          },
          "faq_escalate_docs": {
            label: { en: "I need my transcript/application status", ar: "أحتاج مفردات درجاتي/حالة طلبي" },
            answer: { en: "Please contact the Registrar Office for transcripts, application status, or admissions files.", ar: "يُرجى التواصل مع مكتب شؤون الطلاب للحصول على مفردات الدرجات أو حالة الطلب أو ملفات القبول." }
          }
        }
      }
    }
  };

  var menuPath = []; // stack of node keys

  function currentNode() {
    var node = menu;
    for (var i = 0; i < menuPath.length; i++) node = node.children[menuPath[i]];
    return node;
  }

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function addMessage(text, from) {
    var el = document.createElement('div');
    el.className = 'hue-msg ' + from;
    el.textContent = text;
    messages.appendChild(el);
    scrollToBottom();
  }

  function clearQuickWrap() {
    quickWrap.innerHTML = '';
    quickWrap.classList.remove('hue-menu-list');
  }

  function makeButton(label, className, onClick, index) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = className;
    btn.textContent = label;
    if (typeof index === 'number') btn.style.setProperty('--hue-i', index);
    btn.addEventListener('click', onClick);
    return btn;
  }

  function appendButtons(buttons) {
    buttons.forEach(function (btn, i) {
      btn.style.setProperty('--hue-i', i);
      quickWrap.appendChild(btn);
    });
  }

  var typingEl = null;
  function showTyping() {
    typingEl = document.createElement('div');
    typingEl.className = 'hue-typing';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(typingEl);
    scrollToBottom();
  }
  function hideTyping() {
    if (typingEl && typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
    typingEl = null;
  }
  function botReply(text, callback) {
    showTyping();
    setTimeout(function () {
      hideTyping();
      addMessage(text, 'bot');
      if (callback) callback();
    }, 550);
  }

  // ---- Step 0: language selection ----
  function askLanguage() {
    botReply(STR.en.askLang + ' / ' + STR.ar.askLang, function () {
      clearQuickWrap();
      appendButtons([
        makeButton('English', 'hue-qq', function () { lang = 'en'; onLanguageChosen(); }),
        makeButton('العربية', 'hue-qq', function () { lang = 'ar'; onLanguageChosen(); })
      ]);
    });
  }

  function onLanguageChosen() {
    addMessage(lang === 'ar' ? 'العربية' : 'English', 'user');
    document.getElementById('hue-chat').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    botReply(t('greeting'), function () {
      setTimeout(renderMenu, 200);
    });
  }

  // ---- Menu rendering ----
  function renderMenu() {
    var node = currentNode();
    clearQuickWrap();

    if (!node.children) {
      menuPath = [];
      node = menu;
    }

    var keys = Object.keys(node.children);
    var isSubLevel = menuPath.length > 0;
    quickWrap.classList.toggle('hue-menu-list', keys.length > 6);

    var buttons = [];
    if (isSubLevel) {
      buttons.push(makeButton(t('back'), 'hue-qq-back', function () {
        menuPath.pop();
        renderMenu();
      }));
    }
    keys.forEach(function (key) {
      var child = node.children[key];
      buttons.push(makeButton(child.label[lang], 'hue-qq', function () {
        handleSelect(key, child);
      }));
    });
    appendButtons(buttons);
  }

  function handleSelect(key, child) {
    addMessage(child.label[lang], 'user');
    if (child.children) {
      menuPath.push(key);
      setTimeout(renderMenu, 200);
    } else {
      setTimeout(function () {
        botReply(child.answer[lang], function () {
          setTimeout(askAnythingElse, 200);
        });
      }, 250);
    }
  }

  // ---- "Anything else?" prompt after every answer ----
  function askAnythingElse() {
    addMessage(t('anythingElse'), 'bot');
    clearQuickWrap();
    appendButtons([
      makeButton(t('yes'), 'hue-qq', function () {
        addMessage(t('yes'), 'user');
        setTimeout(renderMenu, 250);
      }),
      makeButton(t('no'), 'hue-qq', function () {
        addMessage(t('no'), 'user');
        setTimeout(showClosing, 250);
      })
    ]);
  }

  function showClosing() {
    addMessage(t('closing'), 'bot');
    clearQuickWrap();
    appendButtons([
      makeButton(t('startOver'), 'hue-qq', function () {
        menuPath = [];
        addMessage(t('startOver'), 'user');
        setTimeout(renderMenu, 250);
      })
    ]);
  }

  var greeted = false;

  function greet() {
    if (greeted) return;
    greeted = true;
    askLanguage();
  }

  function openChat() {
    root.classList.add('hue-open');
    launcherBtn.setAttribute('aria-expanded', 'true');
    chat.setAttribute('aria-hidden', 'false');
    greet();
  }

  function closeChat() {
    root.classList.remove('hue-open');
    launcherBtn.setAttribute('aria-expanded', 'false');
    chat.setAttribute('aria-hidden', 'true');
  }

  launcher.addEventListener('click', openChat);
  closeBtn.addEventListener('click', closeChat);

  // Optional: also open the chat when any element on the page has
  // the class "hue-hero-trigger" (e.g. a button in your hero section).
  document.addEventListener('click', function (e) {
    if (e.target.closest('.hue-hero-trigger')) {
      e.preventDefault();
      openChat();
    }
  });
})();
</script>
